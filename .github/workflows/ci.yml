name: CI
on:
  push:
  pull_request:
  # Weekly against the newest Home Assistant: the integration uses its internal auth
  # API (hass.auth), so a breaking change should show up here before anyone upgrades.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pinned: the release it was verified against; latest: whatever Home Assistant ships now
        ha: [pinned, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install Home Assistant test harness (${{ matrix.ha }})
        run: |
          if [ "${{ matrix.ha }}" = pinned ]; then
            pip install -q pytest-homeassistant-custom-component==0.13.375   # Home Assistant 2026.10.4
          else
            pip install -q --upgrade pytest-homeassistant-custom-component
          fi
          # The camera tests load Home Assistant's camera component; take its own requirements
          # from its manifest (importing camera would already need them).
          pip install -q $(python3 -c "import json, os, homeassistant as h; print(' '.join(json.load(open(os.path.join(os.path.dirname(h.__file__), 'components', 'camera', 'manifest.json')))['requirements']))")
          python3 -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: policy (plain Python, no Home Assistant)
        run: python3 tests/test_policy.py
      - name: integration against Home Assistant
        run: python3 -m pytest -q

  # A real Home Assistant container: install the previous release (or nothing), upgrade in place to
  # this commit, and use it as a household and its phone would (tests/e2e/run.sh).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.10.4", stable]
        from: [previous, fresh]
    name: e2e (${{ matrix.from }}, ${{ matrix.ha }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the release tags, to find the previous release
      - run: tests/e2e/run.sh "${{ matrix.ha }}" "${{ matrix.from }}"
