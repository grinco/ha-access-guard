name: CI
on:
  push:
  pull_request:
  # Weekly against the newest Home Assistant: the integration uses its internal auth
  # API (hass.auth), so a breaking change should show up here before anyone upgrades.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pinned: the release it was verified against; latest: whatever Home Assistant ships now
        ha: [pinned, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install Home Assistant test harness (${{ matrix.ha }})
        run: |
          if [ "${{ matrix.ha }}" = pinned ]; then
            pip install -q pytest-homeassistant-custom-component==0.13.375   # Home Assistant 2026.10.4
          else
            pip install -q --upgrade pytest-homeassistant-custom-component
          fi
          # The camera tests load Home Assistant's camera component; take its own requirements.
          pip install -q $(python3 -c "import json, homeassistant.components.camera as c, os; print(' '.join(json.load(open(os.path.join(os.path.dirname(c.__file__), 'manifest.json')))['requirements']))")
          python3 -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: policy (plain Python, no Home Assistant)
        run: python3 tests/test_policy.py
      - name: integration against Home Assistant
        run: python3 -m pytest -q
